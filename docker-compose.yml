version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: secure_vault_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secure_vault_db_password_2026
      POSTGRES_DB: secure_vault
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d secure_vault"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: secure_vault_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:secure_vault_db_password_2026@postgres:5432/secure_vault?schema=public
      - JWT_ACCESS_SECRET=super_secret_access_token_jwt_pass_2026_production_value
      - JWT_REFRESH_SECRET=super_secret_refresh_token_jwt_pass_2026_production_value
      - JWT_ACCESS_EXPIRY=15m
      - JWT_REFRESH_EXPIRY=7d
      - COOKIE_SECRET=secure_cookie_pepper_vault_2026_prod
      - SERVER_PEPPER=high_security_server_pepper_string_value_aes_256_gcm
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: secure_vault_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      - backend

volumes:
  postgres_data:
